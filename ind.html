<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo formulario</title>
</head>
<body>
    <header>
        <h3>Formulário e inputs</h3>
    </header>
    <main>
        <form id="registration" method="post">
            <label for="name"> Nome completo: </label>
            <input type="text" id="nome" name="nome"
         required />
            <br>
            
            <label for="email">Endereço de e-mail</label>
            <input type="email" id="email" name="email"/>
            
            <br>
            
            <label for="password">Digita a senha aí</label>
            <input type="password" id="password" name="password"
            required minlength="8" title="A senha tem que ter 8 letras bixin"/>
            
            <br>

            <label for="mensagem">Informe sua mensagem</label> <br>
            <textarea name="mensagem" id="mensagem" cols="30" rows="4"></textarea>
            
            <br>
            
            <label for="evento">Selecione o evento escolhido</label>
            <select name="evento" id="evento">
                <option value="rock">Show de rock</option>
                <option value="sertanejo">Show de sertanejo</option>
                <option value="modao">Show de modão</option>
            </select>

            <br>
            <br>

            <label for="termos">
                <input type="checkbox" id="termos" name="termos"
                required>
                Aceito os termos de uso
            </label>

            <br>

            <input type="submit" value="cadastrar">
        </form>

        <br>
        <input type="date"/>
        <br>
        <input type="file">
        <br>
        <input type="text" 
        id="cpf" 
        name="cpf" 
        placeholder="000.000.000-00" 
        required pattern="\d(3)\.\d(3)\.d(3)-\2(d)" 
        title="Formato esperado:000.000.000-00"/>

        <form id="registration" method="post">
            <label><input type="radio" name="pagamento" value="cartao">Cartão</label>
            <label><input type="radio" name="pagamento" value="pix">Pix</label>
        </form>
        
    </main>
    <footer>
    <p>Desenvolvido por Miguel</p>
</footer>

</body>
</html>
